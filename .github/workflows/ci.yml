name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beyen/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          # tests/conftest.py supplies a SQLite DATABASE_URL, a test SECRET_KEY and the test admin
          PYTHONDONTWRITEBYTECODE: "1"

  migrations:
    name: Migrations on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: comis
          POSTGRES_PASSWORD: comis
          POSTGRES_DB: comis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: beyen
    env:
      DATABASE_URL: postgresql://comis:comis@localhost:5432/comis
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-123
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password-123
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beyen/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade a fresh database to head
        run: python -m app.db.migrate
      - name: Downgrade one step and upgrade again
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Schema matches the models (columns and types)
        run: |
          python - <<'EOF'
          from alembic.migration import MigrationContext
          from alembic.autogenerate import compare_metadata
          from app.db.session import engine
          from app.db.base import Base
          with engine.connect() as c:
              diffs = compare_metadata(MigrationContext.configure(c, opts={"compare_type": True}), Base.metadata)
          # Nullability and index-name differences are known/harmless; missing columns or wrong types are not
          serious = [d for d in diffs if not isinstance(d, list) and d[0] in ("add_column", "remove_column", "add_table", "remove_table")]
          serious += [d for d in diffs if isinstance(d, list) and d[0][0] == "modify_type"]
          for d in serious:
              print(d)
          raise SystemExit(1 if serious else 0)
          EOF

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comisbefoe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: comisbefoe/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint (report only — existing warnings are being cleaned up)
        run: npm run lint
        continue-on-error: true
